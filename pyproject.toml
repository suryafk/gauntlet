[project]
name = "gauntlet"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# the injected cursor overlay is a JavaScript string; its lines can't be wrapped
"demo-video/record.py" = ["E501"]
